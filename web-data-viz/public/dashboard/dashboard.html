<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let proximaAtualizacao;

    
    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico() {

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/votos/ultimos`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*
    function plotarGrafico(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];
        let dadosVotos = [];
        let coresDosSuspeitos = []; 
        let totalVotosGeral = 0;
        let maiorQuantidadeVotos = 0;
        let suspeitoMaisVotado = "";
        let houveEmpate = false;

        // passa por todos os registros pra descobrir o total acumulado
        for (let i = 0; i < resposta.length; i++) {
        totalVotosGeral += resposta[i].votos;
    }

    // montar os dados aplicando regra de três e as cores
    for (let i = 0; i < resposta.length; i++) {
        let registro = resposta[i];
        
        // aplicação da fórmula  (votos * 100) / total
        let porcentagem = (registro.votos * 100) / totalVotosGeral;
        
        let labelFormatado = `${registro.personagem} (${porcentagem.toFixed(1)}%)`;
        
        labels.push(labelFormatado); 
        dadosVotos.push(registro.votos);   

        if (registro.votos > maiorQuantidadeVotos) {
            maiorQuantidadeVotos = registro.votos;
            suspeitoMaisVotado = registro.personagem; 
            houveEmpate = false; 
        } else if (registro.votos === maiorQuantidadeVotos && maiorQuantidadeVotos > 0) {
            houveEmpate = true; // 
        }

        let nomeSuspeito = registro.personagem.toLowerCase();
        if (nomeSuspeito == "nate") {
            coresDosSuspeitos.push('#457b9d'); 
        } else if (nomeSuspeito == "bronwyn") {
            coresDosSuspeitos.push('#a8dadc'); 
        } else if (nomeSuspeito == "addy") {
            coresDosSuspeitos.push('#ffb703'); 
        } else if (nomeSuspeito == "cooper") {
            coresDosSuspeitos.push('#c68346'); 
        } else {
            coresDosSuspeitos.push('#e63946'); 
        }
    }
    // calcula a porcentagem do principal suspeito
    let porcentagemMaisVotado = (maiorQuantidadeVotos * 100) / totalVotosGeral;
    
    // atualiza os textos das KPIs 
    document.getElementById("kpi_total").innerHTML = totalVotosGeral;
    
    // operador ternario , condicaçao ? verdadeiro : falso 
    document.getElementById("kpi_suspeito").innerHTML = houveEmpate ? "Empate" : suspeitoMaisVotado;
    
    document.getElementById("kpi_votos_suspeito").innerHTML = `${maiorQuantidadeVotos} votos (${porcentagemMaisVotado.toFixed(1)}%)`;


        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dadosVotos.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Votos',
                    data: dadosVotos,
                    backgroundColor: coresDosSuspeitos
                }]
            }
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart((document.getElementById('meuGraficoCanvas')),
            config
        );

        setTimeout(() => atualizarGrafico(dadosVotos, myChart), 2000);
    }

    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
   
</script>
